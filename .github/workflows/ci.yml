name: Fe Urea Calculator CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m pip check

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Validate Python sources
      run: python -m compileall -q .

    - name: Set up Node.js for browser tests
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Test browser calculation and CSV export
      run: |
        node --check web/app.js
        node --test tests/web.test.mjs

    - name: HMAC audit smoke test
      run: |
        python -c "
        from agents.base import AuditLogger
        assert AuditLogger.verify_integrity() is True
        print('Audit chain integrity smoke test passed')
        "
